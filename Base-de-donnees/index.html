<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Classement en direct</title>
<style>
  :root {
    --bg: #f6f7f9; --carte: #ffffff; --texte: #1c1e21; --discret: #6b7280;
    --bordure: #e3e5e8; --accent: #2563eb; --survol: #eef2ff;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --carte: #181b21; --texte: #e8eaed; --discret: #9aa0a6;
    --bordure: #2a2e36; --accent: #60a5fa; --survol: #1e2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 16px; }
  .barre { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  button {
    padding: 8px 14px; border: 1px solid var(--bordure); border-radius: 8px;
    background: var(--carte); color: var(--texte); cursor: pointer; font-size: 0.9rem;
  }
  button:hover { border-color: var(--accent); }
  #maj { color: var(--discret); font-size: 0.85rem; margin-left: auto; }
  .carte { background: var(--carte); border: 1px solid var(--bordure); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--bordure); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--survol); }
  th { color: var(--discret); font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; }
  td.rang { width: 60px; font-weight: 700; color: var(--accent); }
  td.points, th.points { text-align: right; font-variant-numeric: tabular-nums; }
  .erreur { color: #dc2626; padding: 16px; white-space: pre-wrap; }
  .vide { padding: 24px; text-align: center; color: var(--discret); }
</style>
<script>
  // Applique le thème avant l'affichage (évite le flash blanc)
  (function () {
    let t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<main>
  <h1>🏆 Classement en direct</h1>

  <div class="barre">
    <button id="btn-actualiser">Actualiser</button>
    <button id="btn-pause">Mettre en pause le refresh auto</button>
    <button id="btn-theme" aria-label="Changer de thème">Mode sombre</button>
    <span id="maj"></span>
  </div>

  <div class="carte">
    <div id="erreur" class="erreur" hidden></div>
    <table id="table" hidden>
      <thead><tr><th>#</th><th>Pilote</th><th class="points">Points</th></tr></thead>
      <tbody id="corps"></tbody>
    </table>
    <div id="vide" class="vide">Chargement…</div>
  </div>
</main>

<script>
  const INTERVALLE = 15000; // 15 secondes
  let minuteur = null;
  let enPause = false;

  const $ = (id) => document.getElementById(id);

  function echapper(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function charger() {
    try {
      // La clé Supabase n'est PAS ici : elle reste dans la fonction serveur /api/classement
      const r = await fetch("/api/classement", { cache: "no-store" });
      const data = await r.json();
      if (!r.ok) throw new Error(data.erreur || "Erreur " + r.status);

      $("erreur").hidden = true;
      if (!data.classement.length) {
        $("table").hidden = true;
        $("vide").hidden = false;
        $("vide").textContent = "Aucun résultat pour le moment.";
      } else {
        $("corps").innerHTML = data.classement.map((l) =>
          `<tr><td class="rang">${l.rang}</td><td>${echapper(l.nom)}</td><td class="points">${echapper(l.points)}</td></tr>`
        ).join("");
        $("table").hidden = false;
        $("vide").hidden = true;
      }
      $("maj").textContent = "Dernière actualisation : " + new Date().toLocaleTimeString("fr-FR");
    } catch (e) {
      $("erreur").textContent = "Impossible de charger le classement : " + e.message;
      $("erreur").hidden = false;
      $("vide").hidden = true;
    }
  }

  function demarrerAuto() {
    clearInterval(minuteur);
    minuteur = setInterval(charger, INTERVALLE);
  }

  $("btn-actualiser").addEventListener("click", () => {
    charger();
    if (!enPause) demarrerAuto(); // repart pour 15 s pleines
  });

  $("btn-pause").addEventListener("click", () => {
    enPause = !enPause;
    if (enPause) {
      clearInterval(minuteur);
      $("btn-pause").textContent = "Reprendre le refresh auto";
    } else {
      charger();
      demarrerAuto();
      $("btn-pause").textContent = "Mettre en pause le refresh auto";
    }
  });

  function majBoutonTheme() {
    const sombre = document.documentElement.dataset.theme === "dark";
    $("btn-theme").textContent = sombre ? "Mode clair" : "Mode sombre";
  }
  $("btn-theme").addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("theme", t); } catch (e) {}
    majBoutonTheme();
  });

  majBoutonTheme();
  charger();
  demarrerAuto();
</script>
</body>
</html>
