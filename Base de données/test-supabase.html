<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test Supabase - Tables de l'appli parapente-pps</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.2rem; margin-top: 40px; }
  h2 small { font-weight: normal; color: #666; font-size: 0.85rem; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  nav a { padding: 4px 10px; background: #f4f4f4; border-radius: 12px; text-decoration: none; color: #333; font-size: 0.85rem; }
  nav a:hover { background: #e2e2e2; }
  .barre { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 12px 0; font-size: 0.9rem; }
  .barre button { padding: 6px 14px; border: 1px solid #ccc; border-radius: 6px; background: #f4f4f4; cursor: pointer; }
  .barre button:hover { background: #e2e2e2; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #ddd; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  th { background: #f4f4f4; position: sticky; top: 0; }
  .status { color: #666; font-size: 0.9rem; }
  .error { color: #b00020; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>Base de données Supabase</h1>

<div class="barre">
  <button id="btn-actualiser">Actualiser</button>
  <label><input type="checkbox" id="auto" checked /> Actualisation auto toutes les 10 s</label>
  <span class="status" id="maj"></span>
</div>

<nav id="sommaire"></nav>
<div id="sections"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  // URL du projet dans "Project Overview" puis "Copy" puis "Project URL"
  // Clé API dans "Project settings" puis "API Keys" puis "Publishable key"
  const SUPABASE_URL = "https://gpgxhmuotatvlbvitiro.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_OrRRAe_P7F8ROOjyB8MTRA_1KUPSzkj";

  // Tables de l'appli (mêmes noms que la base locale H2) + colonne utilisée pour le tri
  const TABLES = [
    { nom: "pilotes",              tri: "nom" },
    { nom: "epreuves",             tri: "ordre" },
    { nom: "utilisateurs",         tri: "id" },
    { nom: "epreuve_parametres",   tri: "id" },
    { nom: "bareme_points",        tri: "id" },
    { nom: "inscriptions_epreuve", tri: "id" },
    { nom: "resultats",            tri: "date_saisie" },
  ];

  // Colonnes sensibles jamais affichées (par sécurité)
  const COLONNES_MASQUEES = ["mot_de_passe"];

  const client = SUPABASE_URL && SUPABASE_ANON_KEY
    ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  function echapper(valeur) {
    if (valeur === null || valeur === undefined) return "";
    const texte = typeof valeur === "object" ? JSON.stringify(valeur) : String(valeur);
    return texte.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Crée le bloc HTML d'une table et retourne ses éléments
  function creerSection({ nom }) {
    const section = document.createElement("section");
    section.id = "section-" + nom;
    section.innerHTML = `
      <h2>${nom} <small></small></h2>
      <p class="status">Chargement...</p>
      <pre class="error"></pre>
      <div class="scroll"><table hidden><thead><tr></tr></thead><tbody></tbody></table></div>`;
    document.getElementById("sections").appendChild(section);

    const lien = document.createElement("a");
    lien.href = "#section-" + nom;
    lien.textContent = nom;
    document.getElementById("sommaire").appendChild(lien);

    return {
      compteur: section.querySelector("small"),
      statusEl: section.querySelector(".status"),
      errorEl: section.querySelector(".error"),
      tableEl: section.querySelector("table"),
      headerRow: section.querySelector("thead tr"),
      bodyRows: section.querySelector("tbody"),
    };
  }

  async function chargerSection(table) {
    const { compteur, statusEl, errorEl, tableEl, headerRow, bodyRows } = creerSection(table);

    if (!client) {
      statusEl.textContent = "";
      errorEl.textContent = "Renseignez SUPABASE_URL et SUPABASE_ANON_KEY en haut du script avant de recharger la page.";
      return;
    }

    const { data, error } = await client
      .from(table.nom)
      .select("*")
      .order(table.tri, { ascending: true });

    if (error) {
      statusEl.textContent = "";
      errorEl.textContent =
        "Erreur Supabase : " + error.message +
        "\n\nCauses fréquentes :\n" +
        "- la table '" + table.nom + "' n'existe pas encore (exécutez supabase/setup_supabase.sql)\n" +
        "- la RLS bloque la lecture (ajoutez une policy SELECT sur '" + table.nom + "')\n" +
        "- la colonne de tri '" + table.tri + "' n'existe pas\n" +
        "- l'URL ou la clé sont incorrectes";
      return;
    }

    if (!data || data.length === 0) {
      statusEl.textContent = "Aucune ligne trouvée (ou RLS active sans policy SELECT).";
      compteur.textContent = "(0 ligne)";
      return;
    }

    const colonnes = Object.keys(data[0]).filter(c => !COLONNES_MASQUEES.includes(c));
    headerRow.innerHTML = colonnes.map(c => `<th>${echapper(c)}</th>`).join("");
    bodyRows.innerHTML = data
      .map(row => "<tr>" + colonnes.map(c => `<td title="${echapper(row[c])}">${echapper(row[c])}</td>`).join("") + "</tr>")
      .join("");

    statusEl.textContent = "";
    compteur.textContent = "(" + data.length + " ligne(s))";
    tableEl.hidden = false;
  }

  // Recharge toutes les tables (vide d'abord la page, puis la reconstruit)
  async function toutCharger() {
    document.getElementById("sommaire").innerHTML = "";
    document.getElementById("sections").innerHTML = "";
    await Promise.all(TABLES.map(chargerSection));
    document.getElementById("maj").textContent = "Dernière actualisation : " + new Date().toLocaleTimeString("fr-FR");
  }

  let minuteur = null;
  function appliquerAuto() {
    clearInterval(minuteur);
    if (document.getElementById("auto").checked) minuteur = setInterval(toutCharger, 10000);
  }

  document.getElementById("btn-actualiser").addEventListener("click", toutCharger);
  document.getElementById("auto").addEventListener("change", appliquerAuto);

  toutCharger();
  appliquerAuto();

</script>

</body>
</html>
